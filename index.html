:root{

  --brand:#139A8A; --brand-soft:#D9F2EE; --coral:#F26B5B; --sun:#F4B73F;
  --safe:#2FB26B; --warn:#F2B01E; --danger:#E5483A;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0F1A22;--panel:#1B2A35;--ink:#E7F0F5;--muted:#9BB0BE;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0F1A22;--panel:#1B2A35;--ink:#E7F0F5;--muted:#9BB0BE;color-scheme:dark}
body{background:var(--page);color:var(--ink);font-family:var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;font-size:14px}
#root{display:flex;flex-direction:column;align-items:center;gap:14px}
.demo-bar{width:100%;max-width:560px;background:var(--panel);border-radius:18px;padding:10px 12px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(23,48,66,.12)}
.seg{display:inline-flex;background:var(--page);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:700 12px var(--font);padding:7px 11px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.go{border:0;background:var(--coral);color:#fff;font:800 12px var(--font);padding:9px 14px;border-radius:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.go.stop{background:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.phone{width:390px;height:844px;max-width:100%;flex:none;background:#F7FAFB;color:#173042;border-radius:44px;
  border:10px solid #0E1B24;box-shadow:0 18px 50px rgba(8,20,30,.35);position:relative;overflow:hidden;display:flex;flex-direction:column;box-sizing:content-box}
.phone *{box-sizing:border-box}
.phone-in{width:390px;max-width:100%}
.statusbar{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-weight:800;font-size:12px}
.scroll{flex:1;overflow-y:auto;padding:4px 14px 14px;min-height:0}
.card{background:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 1px 6px rgba(23,48,66,.09)}
.tabbar{flex:none;display:flex;background:#fff;border-top:1px solid #E3ECEF;padding:6px 8px 10px}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 11px var(--font);color:#7C93A3;padding:6px 0;border-radius:12px;cursor:pointer}
.tabbar button.on{color:#139A8A;background:#E5F6F3}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-weight:800;font-size:11px}
.toast{position:absolute;left:10px;right:10px;top:38px;z-index:40;border-radius:18px;padding:11px 13px;color:#fff;display:flex;gap:10px;align-items:flex-start;
  box-shadow:0 10px 26px rgba(0,0,0,.28);animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,58,.65)}70%{box-shadow:0 0 0 26px rgba(229,72,58,0)}100%{box-shadow:0 0 0 0 rgba(229,72,58,0)}}
.sos{animation:pulse 1.5s infinite}
@keyframes blink{50%{opacity:.35}}
.blink{animation:blink 1s infinite}
.dash{stroke-dasharray:6 5}
.flow{stroke-dasharray:9 7;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.overlay{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;color:#fff}
input{font:600 14px var(--font);border:2px solid #D4E2E8;border-radius:12px;padding:10px 12px;width:100%;background:#fff;color:#173042}
@media (prefers-reduced-motion: reduce){.sos,.blink,.flow,.toast{animation:none}}

/* ---------- Map data ---------- */
const HOME = [320, 330], SCHOOL = [60, 70];
const ROUTES = {
  fast: { pts: [[60,70],[60,150],[150,150],[150,250],[250,250],[250,330],[320,330]], min: 12 },
  safe: { pts: [[60,70],[250,70],[320,70],[320,150],[320,250],[320,330]], min: 15 }
};
const polyD = pts => "M" + pts.map(p => p.join(",")).join(" L");
function pointAt(pts, k) {
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); segs.push(l); total += l; }
  let d = Math.max(0, Math.min(1, k)) * total;
  for (let i = 0; i < segs.length; i++) {
    if (d <= segs[i] || i === segs.length - 1) {
      const f = segs[i] ? d / segs[i] : 0;
      return { x: pts[i][0] + (pts[i+1][0]-pts[i][0]) * f, y: pts[i][1] + (pts[i+1][1]-pts[i][1]) * f };
    }
    d -= segs[i];
  }
  return { x: pts[0][0], y: pts[0][1] };
}

const XS = [0, 60, 150, 250, 320, 390], YS = [0, 70, 150, 250, 330, 400];
const BCOL = ["#C9D8E2", "#D6CFE6", "#E6D5C3", "#CFE0D3", "#E3D0D8"];

function Buildings() {
  const out = [];
  for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) {
    if ((i === 1 && j === 2) || (i === 2 && j === 2)) continue; // park + wasteland cells
    const x0 = XS[i] + 14, x1 = XS[i+1] - 14, y0 = YS[j] + 14, y1 = YS[j+1] - 14;
    if (x1 - x0 < 8 || y1 - y0 < 8) continue;
    const c = BCOL[(i * 2 + j * 3) % 5], w = x1 - x0, h = y1 - y0;
    if (w > 60 && h > 40) {
      out.push(<rect key={`a${i}${j}`} x={x0} y={y0} width={w * 0.46} height={h} rx="5" fill={c} />);
      out.push(<rect key={`b${i}${j}`} x={x0 + w * 0.54} y={y0} width={w * 0.46} height={h * 0.62} rx="5" fill={BCOL[(i + j + 1) % 5]} />);
    } else out.push(<rect key={`c${i}${j}`} x={x0} y={y0} width={w} height={h} rx="5" fill={c} />);
  }
  return <g opacity="0.95">{out}</g>;
}

function SafeMap({ t, route, pos, compact, onZone, showBubble, battery, moving, danger }) {
  const sel = ROUTES[route];
  const zone = (k, label, el) => (
    <g onClick={() => onZone && onZone(k)} style={{ cursor: "pointer" }}>{el}</g>
  );
  return (
    <svg viewBox="0 0 390 400" className="w-full block" role="img" aria-label={t.mapTitle} style={{ background: "#EEF3EA" }}>
      {/* streets */}
      {YS.slice(1, 5).map(y => <g key={"h"+y}><rect x="0" y={y-8} width="390" height="16" fill="#fff" /><line x1="0" x2="390" y1={y} y2={y} stroke="#DDE5EA" strokeWidth="1.5" strokeDasharray="8 6" /></g>)}
      {XS.slice(1, 5).map(x => <g key={"v"+x}><rect x={x-8} y="0" width="16" height="400" fill="#fff" /><line y1="0" y2="400" x1={x} x2={x} stroke="#DDE5EA" strokeWidth="1.5" strokeDasharray="8 6" /></g>)}
      <Buildings />
      {/* park */}
      <rect x="76" y="166" width="58" height="68" rx="10" fill="#9AD6A4" />
      {[[92,184],[116,196],[96,216],[118,222]].map((c, i) => <circle key={i} cx={c[0]} cy={c[1]} r="7" fill="#4FAE67" />)}
      <ellipse cx="105" cy="204" rx="9" ry="6" fill="#8FD0E8" />
      {/* wasteland / industrial */}
      <rect x="166" y="166" width="68" height="68" fill="#CDBFAE" />
      {[0,1,2,3,4,5].map(i => <line key={i} x1="166" y1={176 + i * 11} x2={234 - (i % 2) * 14} y2={166 + i * 11 + 6} stroke="#B3A38F" strokeWidth="1.5" />)}
      <rect x="176" y="178" width="22" height="14" fill="#A99884" /><rect x="206" y="208" width="20" height="16" fill="#9E8E7B" />
      {/* safety zones */}
      {zone("park", t.zSafe, <rect x="70" y="160" width="70" height="80" rx="14" fill="#2FB26B" fillOpacity="0.28" stroke="#2FB26B" strokeWidth="2" />)}
      {zone("yard", t.zSafe, <circle cx={HOME[0]} cy={HOME[1]} r="58" fill="#2FB26B" fillOpacity="0.26" stroke="#2FB26B" strokeWidth="2" />)}
      {zone("cross", t.zWarn, <circle cx="320" cy="150" r="36" fill="#F2B01E" fillOpacity="0.34" stroke="#E0A010" strokeWidth="2" />)}
      {zone("danger", t.zDanger, <rect x="156" y="156" width="88" height="88" rx="10" fill="#E5483A" fillOpacity={danger ? 0.5 : 0.34} stroke="#E5483A" strokeWidth="2.5" className={danger ? "blink" : ""} />)}
      {/* geofences */}
      <circle cx={HOME[0]} cy={HOME[1]} r="44" fill="none" stroke="#139A8A" strokeWidth="2.5" className="dash" />
      <circle cx={SCHOOL[0]} cy={SCHOOL[1]} r="44" fill="none" stroke="#139A8A" strokeWidth="2.5" className="dash" />
      {/* routes */}
      {["fast", "safe"].map(k => {
        const on = k === route;
        return <path key={k} d={polyD(ROUTES[k].pts)} fill="none" strokeLinecap="round" strokeLinejoin="round"
          stroke={k === "safe" ? "#139A8A" : "#F26B5B"} strokeWidth={on ? 6 : 3} opacity={on ? 1 : 0.35}
          className={on ? "flow" : ""} strokeDasharray={on ? undefined : "4 6"} />;

  n1: { bg: "#E5483A", icon: "alert", title: "t1" },
  n2: { bg: "#E48A12", icon: "nav", title: "t2" },
  n3: { bg: "#E48A12", icon: "pin", title: "t3" },

};
const fmtTime = (d, lang) => d.toLocaleTimeString(lang === "ru" ? "ru-RU" : "kk-KZ", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const coordsOf = pos => ({ lat: 43.2385 - (pos.y - 200) * 0.00004, lng: 76.8897 + (pos.x - 200) * 0.00005 });

function playAlarm() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext; const ctx = new AC();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "square"; osc.connect(gain); gain.connect(ctx.destination);
    const t0 = ctx.currentTime; gain.gain.setValueAtTime(0.0001, t0);
    for (let i = 0; i < 6; i++) {
      osc.frequency.setValueAtTime(i % 2 ? 660 : 990, t0 + i * 0.25);
      gain.gain.setValueAtTime(0.18, t0 + i * 0.25);
      gain.gain.setValueAtTime(0.0001, t0 + i * 0.25 + 0.22);
    }
    osc.start(t0); osc.stop(t0 + 1.55);
    setTimeout(() => ctx.close && ctx.close(), 1800);
  } catch (e) { /* audio unavailable */ }
}

/* ---------- App ---------- */
const DEFAULT_CONTACTS = [
  { id: 1, key: "mom", phone: "+7 701 234 56 78" }, { id: 2, key: "dad", phone: "+7 702 345 67 89" },
  { id: 3, key: "grandma", phone: "+7 707 456 78 90" }, { id: 4, key: "emergency", phone: "112" }
];
const RUN_MS = 14000;

function App() {
  const [lang, setLang] = useState("ru"), [role, setRole] = useState("parent"), [tab, setTab] = useState("map");
  const [route, setRoute] = useState("safe");
  const [pos, setPos] = useState({ x: SCHOOL[0], y: SCHOOL[1] });
  const [running, setRunning] = useState(false), [danger, setDanger] = useState(false);
  const [notes, setNotes] = useState([]), [toast, setToast] = useState(null);
  const [contacts, setContacts] = useState(DEFAULT_CONTACTS);
  const [sos, setSos] = useState(null), [call, setCall] = useState(null);
  const [scale, setScale] = useState(1);
  const t = T[lang];
  const routeRef = useRef(route); routeRef.current = route;
  const raf = useRef(0), toastTimer = useRef(0);

  useEffect(() => {
    const fit = () => setScale(Math.min(1, (window.innerWidth - 32) / 410));
    fit(); window.addEventListener("resize", fit); return () => window.removeEventListener("resize", fit);
  }, []);

  const notify = type => {
    const n = { id: Date.now() + Math.random(), type, at: new Date() };
    setNotes(ns => [n, ...ns]); setToast(n);
    clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(null), 4500);
  };

  const stopRun = () => { cancelAnimationFrame(raf.current); setRunning(false); };
  const startRun = () => {
    cancelAnimationFrame(raf.current); setRunning(true); setDanger(false);
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / RUN_MS);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      setPos(pointAt(ROUTES[routeRef.current].pts, e));
      if (k < 1) raf.current = requestAnimationFrame(step); else setRunning(false);
    };
    raf.current = requestAnimationFrame(step);
  };
  useEffect(() => () => cancelAnimationFrame(raf.current), []);

  const fire = type => {
    stopRun(); setDanger(false);
    if (type === "n1") { setPos({ x: 200, y: 205 }); setDanger(true); }
    if (type === "n2") setPos({ x: 200, y: 112 });
    if (type === "n3") setPos({ x: 228, y: 376 });
    if (type === "n4") setPos({ x: SCHOOL[0] + 22, y: SCHOOL[1] + 22 });
    notify(type);
  };

  const triggerSOS = () => {
    playAlarm();
    const c = coordsOf(pos);
    setSos({ lat: c.lat, lng: c.lng, at: new Date(), acked: false });
    setNotes(ns => [{ id: Date.now(), type: "sos", at: new Date() }, ...ns]);
  };
  const cancelSOS = () => setSos(null);

  const tabs = [["map", "tabMap", "map"], ["events", "tabEvents", "bell"], ["contacts", "tabContacts", "phone"]];
  const sosParent = role === "parent" && sos && !sos.acked;
  const sosChild = role === "child" && sos;

  return (
    <>
      <div className="demo-bar" role="toolbar">
        <div className="seg">
          <button className={role === "parent" ? "on" : ""} onClick={() => setRole("parent")}>{t.parent}</button>
          <button className={role === "child" ? "on" : ""} onClick={() => setRole("child")}>{t.child}</button>
        </div>
        <div className="seg">
          <button className={lang === "ru" ? "on" : ""} onClick={() => setLang("ru")}>РУС</button>
          <button className={lang === "kk" ? "on" : ""} onClick={() => setLang("kk")}>ҚАЗ</button>
        </div>
        <button className={"go" + (running ? " stop" : "")} onClick={running ? stopRun : startRun}>
          <Icon n={running ? "stop" : "play"} size={13} fill="currentColor" sw={1} />{running ? t.stop : t.run}
        </button>
      </div>

      <div style={{ width: 410 * scale, height: 864 * scale }}>
        <div style={{ transform: `scale(${scale})`, transformOrigin: "top left", width: 410, height: 864 }}>
          <div className="phone" style={{ maxWidth: "none" }}>
            <StatusBar />
            {toast && <Toast key={toast.id} n={toast} t={t} />}
            {role === "parent" ? (
              <>
                {tab === "map" && <MapTab t={t} route={route} setRoute={setRoute} pos={pos} moving={running} battery={84} danger={danger} />}
                {tab === "events" && <EventsTab t={t} lang={lang} notes={notes} fire={fire} />}
                {tab === "contacts" && <ContactsTab t={t} contacts={contacts} setContacts={setContacts} onCall={setCall} />}
                <nav className="tabbar">
                  {tabs.map(x => (
                    <button key={x[0]} className={tab === x[0] ? "on" : ""} onClick={() => setTab(x[0])}>
                      <Icon n={x[2]} size={21} />{t[x[1]]}
                    </button>
                  ))}
                </nav>
              </>
            ) : (
              <ChildScreen t={t} pos={pos} moving={running} contacts={contacts} onCall={setCall} onSOS={triggerSOS} />
            )}
            {sosChild && <ChildSosScreen t={t} sos={sos} lang={lang} onCancel={cancelSOS} />}
            {sosParent && <ParentSosModal t={t} sos={sos} lang={lang} onAck={() => { setSos(s => ({ ...s, acked: true })); setCall(t.mom); }} />}
            {call && <CallOverlay t={t} who={call} onEnd={() => setCall(null)} />}
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
